<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Obi - Estética Nanquim / Feito à Mão</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.js"></script>
    <style>
        :root {
            --bg-yellow: #f6e57a;
            --dark-ink: #111111;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-yellow);
            padding: 40px 20px;
            color: var(--dark-ink);
            margin: 0;
        }

        .container {
            max-width: 840px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 6px;
            box-shadow: 10px 10px 0px #000;
            border: 3px solid #000;
        }

        h1 {
            text-align: center;
            font-weight: 900;
            font-size: 2.5em;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        p.desc {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.05em;
            color: #333;
            line-height: 1.6;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            font-size: 0.95em;
            font-family: monospace;
            box-sizing: border-box;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            background: #fff;
            border-color: #000;
            box-shadow: 3px 3px 0px #000;
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background-color: #000;
            color: var(--bg-yellow);
            border: none;
            font-size: 1.1em;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease-in-out;
            box-shadow: 4px 4px 0px #555;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #000;
        }

        #status {
            margin-top: 25px;
            text-align: center;
            font-weight: 700;
            font-size: 1em;
            min-height: 24px;
        }

        .preview-box {
            margin-top: 30px;
            border: 2px dashed #000;
            padding: 20px;
            text-align: center;
            background: #fdfdfd;
        }

        .preview-box h3 {
            margin-top: 0;
            font-size: 1em;
            text-transform: uppercase;
        }

        #previewCanvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Gerador de Obi Nanquim</h1>
        <p class="desc">
            Insira os endereços (ex: "Avenida Paulista, São Paulo" ou "Copacabana, Rio de Janeiro") para buscar as
            coordenadas automaticamente e gerar a arte do seu obi em estilo <strong>pincelada nanquim</strong>.
        </p>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Endereço de Origem</label>
                    <input type="text" id="endereco1" value="Avenida Paulista, São Paulo">
                </div>
            </div>
            <div class="col">
                <button type="button" onclick="buscarEndereco(1)"
                    style="margin-top: 27px; padding: 12px; font-size: 0.9em;">Buscar Coordenada 1</button>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Posição 1 (Origem) - Latitude</label>
                    <input type="text" id="lat1" value="" placeholder="Preenchido após busca">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label>Posição 1 (Origem) - Longitude</label>
                    <input type="text" id="lon1" value="" placeholder="Preenchido após busca">
                </div>
            </div>
        </div>

        <div class="row" style="margin-top: 15px;">
            <div class="col">
                <div class="form-group">
                    <label>Endereço de Destino</label>
                    <input type="text" id="endereco2" value="Ibirapuera, São Paulo">
                </div>
            </div>
            <div class="col">
                <button type="button" onclick="buscarEndereco(2)"
                    style="margin-top: 27px; padding: 12px; font-size: 0.9em;">Buscar Coordenada 2</button>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label>Posição 2 (Destino) - Latitude</label>
                    <input type="text" id="lat2" value="" placeholder="Preenchido após busca">
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label>Posição 2 (Destino) - Longitude</label>
                    <input type="text" id="lon2" value="" placeholder="Preenchido após busca">
                </div>
            </div>
        </div>

        <button id="btnGerar" onclick="processarObi()" style="margin-top: 20px;">Gerar Trajeto Nanquim e Exportar
            PDF</button>
        <div id="status"></div>

        <div class="preview-box">
            <h3>Pré-visualização da Arte Frontal</h3>
            <canvas id="previewCanvas" width="640" height="3090"></canvas>
        </div>
    </div>

        async function buscarEndereco(num) {
            const inputEl = document.getElementById('endereco' + num);
            const originalQuery = inputEl.value.trim();
            const status = document.getElementById('status');
            if (!originalQuery) {
                alert("Digite um endereço primeiro.");
                return;
            }

            status.innerText = "Buscando coordenadas para o endereço " + num + "...";

            // Criar lista de tentativas (da mais específica para a mais genérica)
            let queries = [
                originalQuery,
                originalQuery.replace(/,\s*\d+\s*-/, ','), // remove número exato se houver hífen
                originalQuery.replace(/\d+/g, ''), // remove todos os números
                originalQuery.split('-')[0].trim() + ", São Paulo" // pega só a primeira parte + São Paulo
            ];

            let found = false;
            for (let q of queries) {
                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`;
                    const response = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
                    const data = await response.json();

                    if (data && data.length > 0) {
                        document.getElementById('lat' + num).value = data[0].lat;
                        document.getElementById('lon' + num).value = data[0].lon;
                        status.innerText = `Endereço ${num} encontrado! (${data[0].display_name})`;
                        status.style.color = "#1e7e34";
                        found = true;
                        break;
                    }
                } catch (e) {
                    console.warn("Tentativa falhou para:", q);
                }
            }

            if (!found) {
                status.innerText = `Endereço ${num} não encontrado automaticamente. Tente simplificar (ex: remover o número ou colocar apenas o nome da rua e bairro).`;
                status.style.color = "#d9534f";
            }
        }

        function catmullRomInterpolate(points, samplesPerSegment = 12) {
            if (points.length < 2) return points;
            const result = [];
            const pts = [points[0], ...points, points[points.length - 1]];

            for (let i = 1; i < pts.length - 2; i++) {
                const p0 = pts[i - 1];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[i + 2];

                for (let t = 0; t < 1; t += 1 / samplesPerSegment) {
                    const t2 = t * t;
                    const t3 = t2 * t;

                    const x = 0.5 * (
                        (2 * p1.x) +
                        (-p0.x + p2.x) * t +
                        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
                    );

                    const y = 0.5 * (
                        (2 * p1.y) +
                        (-p0.y + p2.y) * t +
                        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
                    );

                    result.push({ x, y });
                }
            }
            result.push(points[points.length - 1]);
            return result;
        }

        function desenharLinhaNanquim(ctx, points, width, height) {
            ctx.clearRect(0, 0, width, height);
            if (!points || points.length < 2) return;

            const smoothedPoints = catmullRomInterpolate(points, 15);
            const handDrawnPoints = smoothedPoints.map((pt, idx) => {
                const wobbleX = Math.sin(idx * 0.15) * 6 + Math.cos(idx * 0.3) * 4;
                return { x: pt.x + wobbleX, y: pt.y };
            });

            ctx.fillStyle = '#0f0f0f';
            ctx.strokeStyle = '#0f0f0f';

            for (let i = 0; i < handDrawnPoints.length - 1; i++) {
                const p1 = handDrawnPoints[i];
                const progress = i / handDrawnPoints.length;
                const pressure = Math.sin(progress * Math.PI * 5) * 20 + Math.cos(progress * Math.PI * 2) * 15;
                const radius = Math.max(16, 42 + pressure);

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let i = 0; i < handDrawnPoints.length - 2; i += 2) {
                const p1 = handDrawnPoints[i];
                const p2 = handDrawnPoints[i + 2];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const angle = Math.atan2(dy, dx);
                const normalAngle = angle + Math.PI / 2;

                const progress = i / handDrawnPoints.length;
                const baseRadius = 35 + Math.sin(progress * Math.PI * 5) * 18;

                for (let b = 0; b < 18; b++) {
                    const offsetDistance = (Math.random() - 0.5) * baseRadius * 2.2;
                    const bx = p1.x + Math.cos(normalAngle) * offsetDistance;
                    const by = p1.y + Math.sin(normalAngle) * offsetDistance;

                    const length = 15 + Math.random() * 35;
                    const bx2 = bx + Math.cos(angle) * length + (Math.random() - 0.5) * 4;
                    const by2 = by + Math.sin(angle) * length + (Math.random() - 0.5) * 4;

                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(15, 15, 15, ${0.15 + Math.random() * 0.6})`;
                    ctx.lineWidth = 1 + Math.random() * 4.5;
                    ctx.lineCap = 'round';
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx2, by2);
                    ctx.stroke();
                }
            }

            for (let i = 0; i < handDrawnPoints.length; i += 3) {
                const pt = handDrawnPoints[i];
                for (let g = 0; g < 12; g++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 55;
                    ctx.fillStyle = `rgba(10, 10, 10, ${0.2 + Math.random() * 0.5})`;
                    ctx.fillRect(pt.x + Math.cos(angle) * dist, pt.y + Math.sin(angle) * dist, 1 + Math.random() * 3.5, 1 + Math.random() * 3.5);
                }
            }

            const firstPt = handDrawnPoints[0];
            const lastPt = handDrawnPoints[handDrawnPoints.length - 1];

            ctx.beginPath();
            ctx.arc(firstPt.x, firstPt.y, 48, 0, Math.PI * 2);
            ctx.fillStyle = '#0a0a0a';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(lastPt.x, lastPt.y, 32, 0, Math.PI * 2);
            ctx.fill();
        }

        async function processarObi() {
            const status = document.getElementById('status');
            const btn = document.getElementById('btnGerar');

            const lat1 = document.getElementById('lat1').value.trim();
            const lon1 = document.getElementById('lon1').value.trim();
            const lat2 = document.getElementById('lat2').value.trim();
            const lon2 = document.getElementById('lon2').value.trim();

            if (!lat1 || !lon1 || !lat2 || !lon2) {
                alert("Por favor, preencha ou busque os endereços para obter as coordenadas de origem e destino antes de gerar o PDF.");
                return;
            }

            status.innerText = "Buscando rota e gerando trajeto estilo nanquim...";
            status.style.color = "#000";
            btn.disabled = true;

            try {
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?geometries=geojson`;
                const response = await fetch(osrmUrl);
                if (!response.ok) throw new Error("Erro ao obter rota do mapa.");
                const data = await response.json();

                if (!data.routes || data.routes.length === 0) {
                    throw new Error("Nenhuma rota encontrada para as coordenadas inseridas.");
                }

                const rawCoords = data.routes[0].geometry.coordinates;
                const canvas = document.getElementById('previewCanvas');
                const ctx = canvas.getContext('2d');

                const minLon = Math.min(...rawCoords.map(c => c[0]));
                const maxLon = Math.max(...rawCoords.map(c => c[0]));
                const rangeLon = (maxLon - minLon) || 0.0001;

                const padX = canvas.width * 0.18;
                const padY = canvas.height * 0.04;
                const usableW = canvas.width - (padX * 2);
                const usableH = canvas.height - (padY * 2);

                const mappedPoints = rawCoords.map((coord, idx) => {
                    const normX = (coord[0] - minLon) / rangeLon;
                    const normY = idx / (rawCoords.length - 1);
                    return {
                        x: padX + normX * usableW,
                        y: padY + normY * usableH
                    };
                });

                desenharLinhaNanquim(ctx, mappedPoints, canvas.width, canvas.height);

                status.innerText = "Criando documento PDF...";

                const pdfBytes = Uint8Array.from(atob(templateBase64), c => c.charCodeAt(0));
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                const page = pdfDoc.getPages()[0];

                const imgDataUrl = canvas.toDataURL('image/png');
                const pngImage = await pdfDoc.embedPng(imgDataUrl);

                const mmToPt = 2.83465;
                const startX = 67.5 * mmToPt;

                page.drawImage(pngImage, {
                    x: startX,
                    y: 0,
                    width: 64 * mmToPt,
                    height: 309 * mmToPt
                });

                const pdfBytesOutput = await pdfDoc.save();
                const blob = new Blob([pdfBytesOutput], { type: 'application/pdf' });
                const downloadUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'Obi_Vinil_Nanquim.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                status.innerText = "PDF exportado com sucesso! Verifique sua pasta de downloads.";
                status.style.color = "#1e7e34";

            } catch (err) {
                console.error(err);
                status.innerText = "Erro: " + err.message;
                status.style.color = "#d9534f";
            } finally {
                btn.disabled = false;
            }
        }
